services:
  okg-pwa:
    build: .
    image: okg-pwa:local
    ports:
      - "8080:8787"
    env_file:
      - .env
    environment:
      PORT: "8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped
